services:
  postgres:
    image: postgres:17
    container_name: cherry-core-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor de correo FALSO para desarrollo: recoge los emails y los
  # muestra en http://localhost:8025. Nunca envía nada al exterior.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: cherry-core-mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"

  # Almacenamiento de ficheros (logos, multimedia), compatible con S3/MinIO.
  # Se usa RustFS porque MinIO ya no publica imágenes Docker gratuitas.
  # Consola: http://localhost:9001
  storage:
    image: rustfs/rustfs:1.0.3
    container_name: cherry-core-storage
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-cherrycore}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-cherrycore_dev}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${STORAGE_API_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage_data:/data

volumes:
  postgres_data:
  storage_data:
