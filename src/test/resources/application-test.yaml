# Perfil "test": lo activan los tests de integración (Postgres y S3 por Testcontainers).
spring:
  mail:
    host: localhost
    port: 2525
  security:
    oauth2:
      client:
        # Proveedor "google" falso: solo para comprobar la redirección (no hay login real en tests).
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret
            scope: openid,email,profile
        provider:
          google:
            authorization-uri: https://accounts.example.test/o/oauth2/auth
            token-uri: https://accounts.example.test/token
            jwk-set-uri: https://accounts.example.test/certs
            user-info-uri: https://accounts.example.test/userinfo
            user-name-attribute: sub

cherrycore:
  issuer: http://localhost
  frontend:
    login-url: http://localhost:4200/login
    email-verification-url: http://localhost:4200/verify-email
    password-reset-url: http://localhost:4200/reset-password
    invitation-url: http://localhost:4200/invitation
    email-change-url: http://localhost:4200/confirm-email-change
    admin-url: http://localhost:4200/admin
    social-signup-url: http://localhost:4200/register/complete
    account-activity-url: http://localhost:4200/account/activity
  mail:
    from: no-reply@cherrycore.test
  security:
    # Clave SOLO de desarrollo/tests. Nunca usarla en producción.
    encryption-key: ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXM=
    # Clave HMAC SOLO de desarrollo/tests. Nunca usarla en producción.
    hash-key: ZGV2LW9ubHktaG1hYy1rZXktZm9yLXJlY292ZXJ5LWNvZGVz
    session:
      secure-cookie: false
    signing-key:
      generate-ephemeral: true
    rate-limit:
      # Desactivado por defecto; el test de rate limit lo activa.
      enabled: false
  storage:
    # Los tests de integración sobrescriben endpoint y credenciales con su MinIO (Testcontainers).
    endpoint: http://localhost:9000
    access-key: test
    secret-key: test-secret
    public-base-url: http://localhost:9000
  cors:
    allowed-origins: http://localhost:4200
  oauth:
    # Apps de desarrollo con redirect http://localhost.
    allow-insecure-redirect-uris: true
    clients:
      - client-id: test-bff
        client-name: Test BFF
        type: CONFIDENTIAL
        client-secret: test-bff-secret
        audience: CUSTOMER
        redirect-uris: http://localhost:8081/login/oauth2/code/cherrycore
        post-logout-redirect-uris: http://localhost:4321/
        scopes: openid,profile,email
      - client-id: test-staff-app
        client-name: Test Staff App
        type: CONFIDENTIAL
        client-secret: test-staff-secret
        audience: STAFF
        application-code: test-app
        redirect-uris: http://localhost:8082/login/oauth2/code/cherrycore
        scopes: openid
