# Email texts in ENGLISH.
# Each email: .subject, .body (paragraphs separated by \n\n), .action (button label).
# {0}, {1}... are filled in by the application. A single quote must be written twice ('').

# --- Account --------------------------------------------------------------
email.verification.subject=Confirm your email
email.verification.body=Hello,\n\nThanks for signing up. To activate your account, confirm your email with the button below.\n\nThe link expires in {0} hours. If you did not create an account, please ignore this message.
email.verification.action=Confirm email

email.password-reset.subject=Reset your password
email.password-reset.body=Hello,\n\nWe received a request to reset your password. You can choose a new one with the button below.\n\nThe link expires in {0} minutes. If you did not request it, ignore this message: your password will not change.
email.password-reset.action=Choose a new password

email.registration-existing.subject=Sign-up attempt with your email
email.registration-existing.body=Hello,\n\nSomeone tried to create an account with your email, but you already have one.\n\nIf it was you, sign in. If you do not remember your password, use the "Forgot my password" option.\n\nIf it was not you, you can ignore this message.
email.registration-existing.action=Sign in

email.account-locked.subject=Your account has been temporarily locked
email.account-locked.body=Hello,\n\nWe detected several failed sign-in attempts and locked your account for a few minutes to protect it.\n\nIf it was not you, we recommend changing your password with the "Forgot my password" option.
email.account-locked.action=Go to sign in

email.password-changed.subject=Your password has been changed
email.password-changed.body=Hello,\n\nThe password of your account has just been changed and we have signed you out of all sessions.\n\nIf it was not you, reset your password immediately.
email.password-changed.action=Go to sign in
