# Email texts in ENGLISH.
# {0} = link, {1} = link validity (hours or minutes depending on the email).
# Note: a single quote must be written twice ('') in these files.

email.verification.subject=Confirm your email
email.verification.body=Hello,\n\n\
Thanks for signing up. To activate your account, confirm your email with this link:\n\n\
{0}\n\n\
The link expires in {1} hours. If you did not create an account, please ignore this message.

email.password-reset.subject=Reset your password
email.password-reset.body=Hello,\n\n\
We received a request to reset your password. You can choose a new one with this link:\n\n\
{0}\n\n\
The link expires in {1} minutes. If you did not request it, ignore this message: your password will not change.

email.registration-existing.subject=Sign-up attempt with your email
email.registration-existing.body=Hello,\n\n\
Someone tried to create an account with your email, but you already have one.\n\n\
If it was you, sign in here: {0}\n\
If you do not remember your password, use the "Forgot my password" option.\n\n\
If it was not you, you can ignore this message.

email.account-locked.subject=Your account has been temporarily locked
email.account-locked.body=Hello,\n\n\
We detected several failed sign-in attempts and locked your account for a few minutes to protect it.\n\n\
If it was not you, we recommend changing your password with the "Forgot my password" option at: {0}

email.password-changed.subject=Your password has been changed
email.password-changed.body=Hello,\n\n\
The password of your account has just been changed and we have signed you out of all sessions.\n\n\
If it was not you, reset your password immediately at: {0}
