# Email texts in ENGLISH.
# Each email: .subject, .body (paragraphs separated by \n\n), .action (button label).
# {0}, {1}... are filled in by the application. A single quote must be written twice ('').

# --- Account --------------------------------------------------------------
email.verification.subject=Confirm your email
email.verification.body=Hello,\n\nThanks for signing up. To activate your account, confirm your email with the button below.\n\nThe link expires in {0} hours. If you did not create an account, please ignore this message.
email.verification.action=Confirm email

email.password-reset.subject=Reset your password
email.password-reset.body=Hello,\n\nWe received a request to reset your password. You can choose a new one with the button below.\n\nThe link expires in {0} minutes. If you did not request it, ignore this message: your password will not change.
email.password-reset.action=Choose a new password

email.registration-existing.subject=Sign-up attempt with your email
email.registration-existing.body=Hello,\n\nSomeone tried to create an account with your email, but you already have one.\n\nIf it was you, sign in. If you do not remember your password, use the "Forgot my password" option.\n\nIf it was not you, you can ignore this message.
email.registration-existing.action=Sign in

email.account-locked.subject=Your account has been temporarily locked
email.account-locked.body=Hello,\n\nWe detected several failed sign-in attempts and locked your account for a few minutes to protect it.\n\nIf it was not you, we recommend changing your password with the "Forgot my password" option.
email.account-locked.action=Go to sign in

email.password-changed.subject=Your password has been changed
email.password-changed.body=Hello,\n\nThe password of your account has just been changed and we have signed you out of all sessions.\n\nIf it was not you, reset your password immediately.
email.password-changed.action=Go to sign in

# --- Companies ------------------------------------------------------------
email.company-pending-review.subject=New company pending approval
email.company-pending-review.body=Hello,\n\nThe company {0} (tax id {1}) has signed up and is pending review.
email.company-pending-review.action=Review company

email.company-approved.subject=Your company is now active
email.company-approved.body=Hello,\n\nWe have reviewed and approved {0}. You can now sign in and start working.
email.company-approved.action=Sign in

email.company-rejected.subject=Sign-up request not approved
email.company-rejected.body=Hello,\n\nWe have reviewed the sign-up request for {0} and it has not been approved.\n\nReason: {1}\n\nIf you think this is a mistake, reply to this email.
email.company-rejected.action=

email.staff-invitation.subject=You have been invited to join a team
email.staff-invitation.body=Hello,\n\nYou have been invited to join {0} with the role {1}.\n\nThe invitation expires in {2} days. If you were not expecting this invitation, you can ignore this message.
email.staff-invitation.action=View invitation

# --- Account changes ------------------------------------------------------
email.email-change.subject=Confirm your new email
email.email-change.body=Hello,\n\nYou asked to use this address as the email of your account. Confirm it with the button below.\n\nThe link expires in {0} hours. If you did not request it, ignore this message.
email.email-change.action=Confirm new email

email.email-changed.subject=Your account email has changed
email.email-changed.body=Hello,\n\nThe email of your account has just been changed to another address. From now on you will receive notifications there.\n\nIf it was not you, reset your password immediately and contact us.
email.email-changed.action=Reset password

email.account-deleted.subject=Your account has been deleted
email.account-deleted.body=Hello,\n\nAs requested, we have deleted your account and your personal data.\n\nThank you for having trusted us.
email.account-deleted.action=
