# Textos de los emails en ESPAÑOL (idioma por defecto).
# Cada email: .subject (asunto), .body (párrafos separados por \n\n), .action (texto del botón).
# {0}, {1}... son valores que rellena la aplicación. Una comilla simple se escribe doble ('').

# --- Cuenta ---------------------------------------------------------------
email.verification.subject=Confirma tu email
email.verification.body=Hola:\n\nGracias por registrarte. Para activar tu cuenta, confirma tu email con el botón de abajo.\n\nEl enlace caduca en {0} horas. Si no has creado ninguna cuenta, ignora este mensaje.
email.verification.action=Confirmar email

email.password-reset.subject=Restablece tu contraseña
email.password-reset.body=Hola:\n\nHemos recibido una solicitud para restablecer tu contraseña. Puedes elegir una nueva con el botón de abajo.\n\nEl enlace caduca en {0} minutos. Si no lo has pedido tú, ignora este mensaje: tu contraseña no cambiará.
email.password-reset.action=Elegir nueva contraseña

email.registration-existing.subject=Intento de registro con tu email
email.registration-existing.body=Hola:\n\nAlguien ha intentado crear una cuenta con tu email, pero ya tienes una.\n\nSi has sido tú, inicia sesión. Si no recuerdas tu contraseña, usa la opción "He olvidado mi contraseña".\n\nSi no has sido tú, puedes ignorar este mensaje.
email.registration-existing.action=Iniciar sesión

email.account-locked.subject=Tu cuenta se ha bloqueado temporalmente
email.account-locked.body=Hola:\n\nHemos detectado varios intentos fallidos de inicio de sesión y hemos bloqueado tu cuenta durante unos minutos para protegerla.\n\nSi no has sido tú, te recomendamos cambiar tu contraseña con la opción "He olvidado mi contraseña".
email.account-locked.action=Ir al inicio de sesión

email.password-changed.subject=Tu contraseña se ha cambiado
email.password-changed.body=Hola:\n\nLa contraseña de tu cuenta se acaba de cambiar y hemos cerrado todas tus sesiones abiertas.\n\nSi no has sido tú, restablece tu contraseña de inmediato.
email.password-changed.action=Ir al inicio de sesión

# --- Empresas -------------------------------------------------------------
email.company-pending-review.subject=Nueva empresa pendiente de aprobación
email.company-pending-review.body=Hola:\n\nLa empresa {0} (identificación fiscal {1}) se ha registrado y está pendiente de revisión.
email.company-pending-review.action=Revisar empresa

email.company-approved.subject=Tu empresa ya está activa
email.company-approved.body=Hola:\n\nHemos revisado y aprobado {0}. Ya puedes iniciar sesión y empezar a trabajar.
email.company-approved.action=Iniciar sesión

email.company-rejected.subject=Solicitud de alta no aprobada
email.company-rejected.body=Hola:\n\nHemos revisado la solicitud de alta de {0} y no ha sido aprobada.\n\nMotivo: {1}\n\nSi crees que es un error, responde a este email.
email.company-rejected.action=

email.staff-invitation.subject=Te han invitado a unirte a un equipo
email.staff-invitation.body=Hola:\n\nTe han invitado a unirte a {0} con el rol {1}.\n\nLa invitación caduca en {2} días. Si no esperabas esta invitación, puedes ignorar este mensaje.
email.staff-invitation.action=Ver invitación
