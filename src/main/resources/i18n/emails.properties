# Textos de los emails en ESPAÑOL (idioma por defecto).
# {0} = enlace, {1} = validez del enlace (horas o minutos según el email).
# Ojo: en estos ficheros una comilla simple se escribe doble ('').

email.verification.subject=Confirma tu email
email.verification.body=Hola:\n\n\
Gracias por registrarte. Para activar tu cuenta, confirma tu email en este enlace:\n\n\
{0}\n\n\
El enlace caduca en {1} horas. Si no has creado ninguna cuenta, ignora este mensaje.

email.password-reset.subject=Restablece tu contraseña
email.password-reset.body=Hola:\n\n\
Hemos recibido una solicitud para restablecer tu contraseña. Puedes elegir una nueva en este enlace:\n\n\
{0}\n\n\
El enlace caduca en {1} minutos. Si no lo has pedido tú, ignora este mensaje: tu contraseña no cambiará.

email.registration-existing.subject=Intento de registro con tu email
email.registration-existing.body=Hola:\n\n\
Alguien ha intentado crear una cuenta con tu email, pero ya tienes una.\n\n\
Si has sido tú, inicia sesión aquí: {0}\n\
Si no recuerdas tu contraseña, usa la opción "He olvidado mi contraseña".\n\n\
Si no has sido tú, puedes ignorar este mensaje.

email.account-locked.subject=Tu cuenta se ha bloqueado temporalmente
email.account-locked.body=Hola:\n\n\
Hemos detectado varios intentos fallidos de inicio de sesión y hemos bloqueado tu cuenta durante unos minutos para protegerla.\n\n\
Si no has sido tú, te recomendamos cambiar tu contraseña con la opción "He olvidado mi contraseña" en: {0}

email.password-changed.subject=Tu contraseña se ha cambiado
email.password-changed.body=Hola:\n\n\
La contraseña de tu cuenta se acaba de cambiar y hemos cerrado todas tus sesiones abiertas.\n\n\
Si no has sido tú, restablece tu contraseña de inmediato en: {0}
