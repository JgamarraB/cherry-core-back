spring:
  application:
    name: cherry-core-app

  autoconfigure:
    # Sin usuario por defecto con contraseña generada: los usuarios vienen de la base de datos.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cherry_core}
    username: ${DB_USERNAME:cherrycore}
    password: ${DB_PASSWORD:cherrycore_dev}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    deserialization:
      # Rechaza campos desconocidos en el JSON (protección contra mass assignment).
      fail-on-unknown-properties: true

server:
  error:
    # Nunca exponer detalles internos en errores no controlados.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ---------------------------------------------------------------
# Configuración propia de CherryCore (CherryCoreProperties).
# Todo lo ajustable se cambia aquí.
# ---------------------------------------------------------------
cherrycore:
  security:
    tokens:
      access-token-ttl: 15m
      customer-refresh-token-ttl: 30d
      staff-refresh-token-ttl: 12h
  cors:
    # Frontends que pueden llamar a la API. Separados por comas en la variable de entorno.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4321}
    max-age: 1h
