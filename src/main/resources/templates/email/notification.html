<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${subject}">Asunto</title>
</head>
<!-- Estilos en línea: muchos clientes de correo ignoran las hojas de estilo. -->
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0"
               style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;">
          <tr>
            <td style="padding:24px 32px;border-bottom:1px solid #e4e4e7;">
              <img th:if="${!#strings.isEmpty(logoUrl)}" th:src="${logoUrl}" th:alt="${brandName}"
                   style="max-height:40px;max-width:200px;display:block;">
              <span th:if="${#strings.isEmpty(logoUrl)}" th:text="${brandName}"
                    style="font-size:20px;font-weight:bold;">Marca</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 th:text="${subject}" style="font-size:20px;margin:0 0 16px;">Asunto</h1>
              <p th:each="paragraph : ${paragraphs}" th:text="${paragraph}"
                 style="font-size:15px;line-height:1.6;margin:0 0 16px;white-space:pre-line;">Texto</p>
              <table th:if="${!#strings.isEmpty(actionUrl)}" role="presentation" cellpadding="0" cellspacing="0"
                     style="margin:24px 0;">
                <tr>
                  <td style="background:#18181b;border-radius:6px;">
                    <a th:href="${actionUrl}" th:text="${actionLabel}"
                       style="display:inline-block;padding:12px 24px;color:#ffffff;text-decoration:none;font-weight:bold;">Acción</a>
                  </td>
                </tr>
              </table>
              <p th:if="${!#strings.isEmpty(actionUrl)}"
                 style="font-size:12px;color:#71717a;word-break:break-all;" th:text="${actionUrl}">enlace</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;border-top:1px solid #e4e4e7;font-size:12px;color:#71717a;"
                th:text="${brandName}">Marca</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
